<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GTAVI Guide Hub icon</title>
  <desc id="desc">A neon Vice City inspired GTAVI guide mark with palm, map pin, and completion check.</desc>
  <defs>
    <linearGradient id="sky" x1="72" y1="54" x2="450" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset=".42" stop-color="#d93688"/>
      <stop offset=".72" stop-color="#6f45ff"/>
      <stop offset="1" stop-color="#0aa6c9"/>
    </linearGradient>
    <linearGradient id="gold" x1="146" y1="152" x2="378" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset=".5" stop-color="#f5bf3d"/>
      <stop offset="1" stop-color="#d98218"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
