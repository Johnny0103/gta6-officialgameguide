    <path d="M250 340c4-59 13-111 29-163" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M286 177c-45-26-83-26-121 0 45-58 91-61 121 0z" fill="#141820"/>
